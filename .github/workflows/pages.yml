# Publish the static demo (web map in static mode + pre-computed data + API reference) to
# GitHub Pages. The data in web/data is exported locally with `docker compose run --rm export`
# and committed, so this workflow needs no database.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/openapi.json"
      - "scripts/build_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the static site
        run: scripts/build_pages.sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
