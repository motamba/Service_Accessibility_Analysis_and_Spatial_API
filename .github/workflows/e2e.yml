# Full end-to-end run: download fresh data, run the whole pipeline with `docker compose up`,
# then run every test, including the API tests against the real results.
# Takes 10-20 minutes, so it runs weekly and on demand rather than on every push.
name: End-to-end

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Run containers as the runner user (so ./data is writable)
        run: |
          echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and start (database, pipeline, API)
        run: docker compose up --build --detach --wait

      - name: Pipeline summary
        run: docker compose run --rm etl make status

      - name: All tests, including API tests on the real data
        run: docker compose run --rm test

      - name: Smoke test the running API
        run: |
          curl --fail --silent http://localhost:8000/health
          curl --fail --silent --output /dev/null \
            "http://localhost:8000/service-areas?type=health&mode=walk&minutes=30"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
