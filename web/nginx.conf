server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The map calls the API on the same address, so no cross-origin set-up is needed.
    # ^~ : the API prefix wins over the *.json rule below
    location ^~ /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff;
    }

    location ~* \.(geojson|json)$ {
        types { application/geo+json geojson; application/json json; }
        add_header Cache-Control "public, max-age=600";
    }

    gzip on;
    gzip_types application/json application/geo+json application/javascript text/css;
    gzip_min_length 1000;
}
