name: banjul-access

x-db-env: &db-env
  PGHOST: db
  PGPORT: "5432"
  PGDATABASE: gis
  PGUSER: ${POSTGRES_USER:-gis}
  PGPASSWORD: ${POSTGRES_PASSWORD:-gis}

services:
  db:
    # PostgreSQL 17 + PostGIS 3.5 + pgRouting 3.8.0 (exact tag pinned for reproducibility)
    image: pgrouting/pgrouting:17-3.5-3.8.0
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: ${POSTGRES_USER:-gis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gis}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first-time initialisation the entrypoint runs a temporary
      # server on the Unix socket only, which would otherwise pass this check too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d gis"]
      interval: 5s
      timeout: 5s
      retries: 30

  etl:
    # Runs the data pipeline once, then exits. Re-running is cheap: finished steps are skipped.
    build: ./etl
    # Run as the host user so files written to ./data are not owned by root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-env
    volumes:
      - ./data:/data

  api:
    # REST API (FastAPI). Starts once the pipeline has finished. Docs: http://localhost:8000/docs
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@db:5432/gis
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # Web map: http://localhost:8080 (nginx serves ./web and forwards /api/ to the API)
    image: nginx:1.28.0-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  test:
    # Tests: `docker compose run --rm test`. Builds a separate gis_test database on the same
    # server, so the real data is never touched. Not started by `docker compose up`.
    build:
      context: ./api
      args:
        DEV: "true"
    profiles: ["test"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@db:5432/gis
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@db:5432/gis
      ETL_SQL_DIR: /etl-sql
    volumes:
      - ./api:/app
      - ./etl/sql:/etl-sql:ro
    command: ["pytest"]

  export:
    # Static files for the GitHub Pages demo: `docker compose run --rm export` -> web/data
    build:
      context: ./api
      args:
        DEV: "true"
    profiles: ["tools"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gis}:${POSTGRES_PASSWORD:-gis}@db:5432/gis
    volumes:
      - ./api:/app
      - ./web/data:/out
    command: ["python", "-m", "scripts.export_static", "/out"]

volumes:
  pgdata: {}
